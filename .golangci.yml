version: "2"
run:
  timeout: 3m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
  exclusions:
    paths:
      - frontend/
      - bin/
      - e2e/
      # Wails platform scaffolding (ios/android/docker helpers); not part of desktop CI build.
      - build/
