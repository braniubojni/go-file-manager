# Cross-platform production builds (native runners per OS).
# See https://v3.wails.io/guides/build/cross-platform/
#
# On tag v1.2.3:
#   - builds linux/darwin/windows packages
#   - injects version into internal/version.Version
#   - uploads assets named for the in-app updater:
#       go-file-manager_{version}_{os}_{arch}.{ext}

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
            archive: zip
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Linux webview deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # Keep Wails package metadata in sync (portable)
          perl -i -pe "s/version: [\"']0\\.0\\.1[\"']/version: \"$VER\"/" build/config.yml

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          case "${{ matrix.goos }}" in
            darwin)
              # .app bundle for distribution
              wails3 task darwin:package VERSION="$VER" ARCH="${{ matrix.goarch }}"
              ;;
            windows)
              wails3 task windows:build VERSION="$VER" ARCH="${{ matrix.goarch }}" CGO_ENABLED=0
              ;;
            linux)
              wails3 task linux:build VERSION="$VER" ARCH="${{ matrix.goarch }}"
              ;;
          esac

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          OS="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"
          NAME="go-file-manager_${VER}_${OS}_${ARCH}"
          mkdir -p dist

          case "$OS" in
            darwin)
              # Zip the .app bundle
              if [ -d "bin/go-file-manager.app" ]; then
                (cd bin && zip -ry "../dist/${NAME}.zip" go-file-manager.app)
              else
                echo "Expected bin/go-file-manager.app"
                ls -la bin/ || true
                exit 1
              fi
              echo "asset=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
              ;;
            windows)
              EXE="bin/go-file-manager.exe"
              if [ ! -f "$EXE" ]; then
                echo "Expected $EXE"
                ls -la bin/ || true
                exit 1
              fi
              (cd bin && zip -9 "../dist/${NAME}.zip" go-file-manager.exe)
              echo "asset=dist/${NAME}.zip" >> "$GITHUB_OUTPUT"
              ;;
            linux)
              BIN="bin/go-file-manager"
              if [ ! -f "$BIN" ]; then
                echo "Expected $BIN"
                ls -la bin/ || true
                exit 1
              fi
              tar -C bin -czf "dist/${NAME}.tar.gz" go-file-manager
              echo "asset=dist/${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac
        id: pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "$VER" > VERSION

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: List assets
        run: find release-assets -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            VERSION
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
