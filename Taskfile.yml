version: '3'

vars:
  APP_NAME: "go-file-manager"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"
        vars:
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
          CGO_ENABLED: '{{.CGO_ENABLED}}'

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
        vars:
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION}}'
          DEV: '{{.DEV}}'

  # Local cross-compile helpers (see https://v3.wails.io/guides/build/cross-platform/)
  # One-time for non-native targets: wails3 task setup:docker
  build:windows:
    summary: Cross-build Windows (native Go; set CGO_ENABLED=1 for Docker CGO)
    cmds:
      - task: windows:build
        vars:
          ARCH: '{{.ARCH | default "amd64"}}'
          VERSION: '{{.VERSION}}'
          CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:linux:
    summary: Cross-build Linux (Docker on macOS/Windows uses gtk3; native Linux uses GTK4)
    desc: |
      From macOS/Windows: uses wails-cross Docker + gtk3 tag (image has GTK 4.8 only).
      From Linux with gcc: native GTK4 build.
      Example: task build:linux ARCH=arm64 VERSION=0.1.0
    cmds:
      - task: linux:build
        vars:
          ARCH: '{{.ARCH | default "amd64"}}'
          VERSION: '{{.VERSION}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'

  build:darwin:
    summary: Cross-build macOS (Docker on Linux/Windows, native on macOS)
    cmds:
      - task: darwin:build
        vars:
          ARCH: '{{.ARCH | default ARCH}}'
          VERSION: '{{.VERSION}}'

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Unit tests (Go)
    cmds:
      - go test ./internal/...

  lint:
    summary: Go + frontend lint/format/typecheck
    cmds:
      - gofmt -l .
      - go vet ./...
      - task: frontend:lint

  frontend:lint:
    dir: frontend
    cmds:
      - npm run typecheck
      - npm run lint
      - npm run format:check

  test:e2e:
    summary: Playwright e2e against Wails server mode
    dir: e2e
    cmds:
      - npm test

  test:all:
    summary: Full gate — unit + e2e + production build (run after big changes)
    cmds:
      - task: test
      - task: test:e2e
      - wails3 build

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
